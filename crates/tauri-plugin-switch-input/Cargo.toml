[package]
name = "tauri-plugin-switch-input"
version.workspace = true
authors.workspace = true
description = "Capture Nintendo Switch (LineageOS/Android) hardware buttons, analog sticks, dpad, touch, IMU and rumble in Tauri apps."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.90"
links = "tauri-plugin-switch-input"
exclude = ["/android", "/permissions/autogenerated"]

[lib]
name = "tauri_plugin_switch_input"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
