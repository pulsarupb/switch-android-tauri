[package]
name = "switch-input-demo"
version.workspace = true
authors.workspace = true
description = "Demo application for tauri-plugin-switch-input."
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "switch_input_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = [] }
tauri-plugin-switch-input = { path = "../../../crates/tauri-plugin-switch-input" }
serde = { workspace = true }
serde_json = { workspace = true }
