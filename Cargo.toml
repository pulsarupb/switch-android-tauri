[workspace]
resolver = "2"
members = [
    "crates/tauri-plugin-switch-input",
    "apps/demo/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pulsarupb/switch-android-tauri"
authors = ["pulsarupb"]

[workspace.dependencies]
tauri = "2"
tauri-build = "2"
tauri-plugin = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
